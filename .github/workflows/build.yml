name: Build Clash config

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
          python-version: "3.12"

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Install Mihomo
      shell: bash
      run: |
            set -euo pipefail
        
            MIHOMO_VERSION="v1.19.30"
            MIHOMO_FILE="mihomo-linux-amd64-v3-v1.19.30.gz"
            MIHOMO_URL="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${MIHOMO_FILE}"
        
            curl -fL "$MIHOMO_URL" -o mihomo.gz
            gunzip mihomo.gz
            chmod +x mihomo
        
            ./mihomo -v
    
    - name: Build
      env:
        TOP_N: "50"
      run: python -m builder

    - name: Publish dist branch
      shell: bash
      run: |
        set -euo pipefail
    
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    
        # Save generated artifacts outside the Git working tree.
        mkdir -p /tmp/generated
        cp -R dist/. /tmp/generated/
    
        # Check whether dist branch exists on remote.
        if git ls-remote --exit-code --heads origin dist >/dev/null 2>&1; then
          echo "dist branch exists"
          git fetch origin dist
          git worktree add /tmp/dist-branch origin/dist
        else
          echo "dist branch does not exist; creating it"
          git worktree add --orphan /tmp/dist-branch
        fi
    
        cd /tmp/dist-branch
    
        # Remove everything from the dist branch.
        git rm -rf . >/dev/null 2>&1 || true
    
        # Copy fresh generated artifacts.
        cp -R /tmp/generated/. .
    
        git add -A
    
        if git diff --cached --quiet; then
          echo "No changes in generated config."
          exit 0
        fi
    
        git commit -m "chore: update generated config"
        git push origin HEAD:dist
    